<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Confirm it's you</title>
</head>
<body style="margin:0;padding:0;background:#0b0b12;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your UniMate security code.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b12;padding:40px 14px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Helvetica,Arial,sans-serif;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#15161e;border:1px solid rgba(255,255,255,0.08);border-radius:24px;overflow:hidden;">
          <tr><td style="height:4px;background:#19b8a6;font-size:0;line-height:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding:38px 30px 4px;text-align:center;">
              <img src="https://omar-unimate.vercel.app/apple-touch-icon.png" width="64" height="64" alt="UniMate" style="display:block;margin:0 auto;width:64px;height:64px;border-radius:16px;">
              <p style="font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#19b8a6;margin:24px 0 8px;">Security check</p>
              <h1 style="font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-0.02em;margin:0 0 12px;color:#ffffff;">Confirm it's you</h1>
              <p style="font-size:15px;line-height:1.6;color:rgba(255,255,255,0.55);margin:0;">Enter this code in UniMate to continue with this change.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:26px 30px 6px;">
              <div style="display:inline-block;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px 28px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:34px;font-weight:800;letter-spacing:10px;color:#19b8a6;">{{ .Token }}</div>
              <p style="font-size:12px;line-height:1.6;color:rgba(255,255,255,0.4);margin:12px 0 0;">This code expires soon. Never share it with anyone.</p>
            </td>
          </tr>
          <tr><td style="height:24px;font-size:0;line-height:0;">&nbsp;</td></tr>
          <tr>
            <td style="border-top:1px solid rgba(255,255,255,0.06);padding:20px 30px;text-align:center;">
              <p style="font-size:12px;line-height:1.6;color:rgba(255,255,255,0.4);margin:0;">Didn't ask for a code? Reset your password right away.</p>
              <p style="font-size:12px;color:rgba(255,255,255,0.25);margin:10px 0 0;">© UniMate · Your university life, organized.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
