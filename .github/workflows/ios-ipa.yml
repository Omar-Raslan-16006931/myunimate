name: Build iOS IPA

# Builds an unsigned UniMate.ipa for sideloading (Sideloadly, AltStore, ...).
# The sideloading tool signs it with your own Apple ID when it installs.

on:
  workflow_dispatch:
  push:
    branches: [main, live-activity]

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check that the Supabase secrets exist
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions, then run this again."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Create the iOS project
        run: bash native/ios-prepare.sh

      - name: Add the Dynamic Island and lock screen countdown
        id: island
        continue-on-error: true
        run: |
          ruby -rxcodeproj -e '' 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby native/add-live-activity.rb
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities true" "$PLIST"

      - name: Build the app without signing
        id: build_island
        if: steps.island.outcome == 'success'
        continue-on-error: true
        run: bash native/ios-build.sh

      # Safety net: if the island part breaks anything, still ship a normal IPA (just without the island).
      - name: Build again without the island (only runs if the island broke the build)
        if: steps.island.outcome != 'success' || steps.build_island.outcome != 'success'
        run: |
          echo "::warning::The Dynamic Island part failed, so this IPA has NO island. See the failed steps above for why."
          rm -rf ios
          npm pkg delete dependencies.unimate-live
          rm -rf node_modules/unimate-live
          bash native/ios-prepare.sh
          bash native/ios-build.sh

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" Payload/
          zip -qry UniMate.ipa Payload
          ls -lh UniMate.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: UniMate-ipa
          path: UniMate.ipa
          if-no-files-found: error
