
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f16" />
    <title>UniMate</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <style>
      :root {
        /* Dark glass theme (teal accent) */
        --accent: #19b8a6; --accent-text: #5fdccd; --on-accent: #04201c;
        --bg:
          radial-gradient(70% 38% at 8% 0%, rgba(37, 99, 235, 0.24), transparent 72%),
          radial-gradient(60% 34% at 105% 32%, rgba(13, 148, 136, 0.20), transparent 70%),
          radial-gradient(75% 40% at 20% 100%, rgba(219, 39, 119, 0.13), transparent 72%),
          #0f0f16;
        --surface: rgba(255,255,255,0.075); --surface-2: rgba(255,255,255,0.13); --line: rgba(255,255,255,0.15);
        --text: #f5f6f8; --muted: rgba(238,240,246,0.64);
        --nav: rgba(28,32,40,0.55); --nav-active: var(--accent); --nav-active-ink: var(--on-accent); --nav-ink: rgba(238,240,246,0.7);
        --grid-head: #101016; --grid-bg: rgba(255,255,255,0.05);
        --tile-1: #6aa5ff; --tile-2: #2fd0bd; --tile-3: #f777b3;
        --chip-bg: rgba(255,255,255,0.1);
        --glass-blur: blur(22px) saturate(170%);
        --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.24), 0 10px 28px rgba(0,0,0,0.28);
        --hero-bg: linear-gradient(165deg, rgba(255,255,255,0.20), rgba(255,255,255,0.09));
        --hero-ink: #ffffff;
        --nav-shadow: inset 0 1px 0 rgba(255,255,255,0.26), 0 14px 34px rgba(0,0,0,0.45);

        /* names the rest of the app already uses */
        --bg-gradient: var(--bg);
        --card-bg: var(--surface);
        --card-border: 1px solid var(--line);
        --glass-border: 1px solid var(--line);
        --text-primary: var(--text);
        --text-muted: var(--muted);
        --nav-bg: var(--nav);
        --nav-active-bg: rgba(25, 184, 166, 0.2);
        --input-bg: rgba(255,255,255,0.05);
        --modal-bg: #12141a;
        --schedule-header-bg: var(--grid-head);
        --schedule-grid-lines: var(--line);
      }

      body.light-mode {
        /* Light Mode Overrides */
        --accent: #0f9d8d; --accent-text: #0b7d70; --on-accent: #ffffff;
        --bg: radial-gradient(circle at 50% -20%, #d9f3ef 0%, #f3f4f6 60%, #ffffff 100%);
        --surface: rgba(255,255,255,0.72); --surface-2: rgba(15,23,42,0.06); --line: rgba(15,23,42,0.1);
        --text: #0f172a; --muted: rgba(15,23,42,0.62);
        --nav: rgba(255,255,255,0.75); --nav-ink: rgba(15,23,42,0.62);
        --grid-head: #ffffff; --grid-bg: rgba(255,255,255,0.6);
        --tile-1: #2563eb; --tile-2: #0d9488; --tile-3: #db2777;
        --chip-bg: rgba(15,23,42,0.06);
        --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 8px 22px rgba(15,23,42,0.08);
        --hero-bg: linear-gradient(165deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
        --hero-ink: #0f172a;
        --nav-shadow: 0 10px 28px rgba(15,23,42,0.14);
        --nav-active-bg: rgba(15, 157, 141, 0.12);
        --input-bg: rgba(0,0,0,0.05);
        --modal-bg: #ffffff;
      }

      body {
        background-color: #0f0f16;
        background-image: var(--bg-gradient);
        color: var(--text-primary);
        overflow-x: hidden;
        transition: background-image 0.5s ease, color 0.5s ease;
      }
      
      .hide-scroll::-webkit-scrollbar { display: none; }
      .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      /* no visible scrollbars on touch screens */
      @media (pointer: coarse) { .custom-scrollbar::-webkit-scrollbar { display: none; } .custom-scrollbar { scrollbar-width: none; } }
      .ev-chip { background: var(--chip-bg); border: 1px solid var(--line); }
      .spin-ring { border-color: var(--line); border-top-color: var(--text); }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

      /* ============================================================
         Enter/Exit animation utilities (tailwindcss-animate shim)
         The app uses `animate-in fade-in zoom-in-95 ...` classes that
         require the tailwindcss-animate plugin which is NOT available
         via the CDN build — without this shim none of them animate.
         ============================================================ */
      @keyframes tw-enter {
        from {
          opacity: var(--tw-enter-opacity, 1);
          transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0)
            scale3d(var(--tw-enter-scale, 1), var(--tw-enter-scale, 1), var(--tw-enter-scale, 1));
        }
      }
      .animate-in { animation: tw-enter 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .fade-in { --tw-enter-opacity: 0; }
      .zoom-in-95 { --tw-enter-scale: 0.95; }
      .zoom-in-90 { --tw-enter-scale: 0.9; }
      .slide-in-from-top-1 { --tw-enter-translate-y: -0.25rem; }
      .slide-in-from-top-2 { --tw-enter-translate-y: -0.5rem; }
      .slide-in-from-top-4 { --tw-enter-translate-y: -1rem; }
      .slide-in-from-bottom-1 { --tw-enter-translate-y: 0.25rem; }
      .slide-in-from-bottom-2 { --tw-enter-translate-y: 0.5rem; }
      .slide-in-from-bottom-4 { --tw-enter-translate-y: 1rem; }
      .slide-in-from-bottom-5 { --tw-enter-translate-y: 1.25rem; }
      .slide-in-from-bottom-8 { --tw-enter-translate-y: 2rem; }
      .slide-in-from-bottom-10 { --tw-enter-translate-y: 2.5rem; }
      .slide-in-from-left-2 { --tw-enter-translate-x: -0.5rem; }
      .slide-in-from-left-4 { --tw-enter-translate-x: -1rem; }
      .slide-in-from-right-2 { --tw-enter-translate-x: 0.5rem; }
      .slide-in-from-right-4 { --tw-enter-translate-x: 1rem; }
      .slide-in-from-right-10 { --tw-enter-translate-x: 2.5rem; }
      .animate-in.duration-100 { animation-duration: 100ms; }
      .animate-in.duration-200 { animation-duration: 200ms; }
      .animate-in.duration-300 { animation-duration: 300ms; }
      .animate-in.duration-500 { animation-duration: 500ms; }

      /* Staggered list entrance helper */
      .stagger-children > * { animation: tw-enter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; --tw-enter-opacity: 0; --tw-enter-translate-y: 0.75rem; }
      .stagger-children > *:nth-child(1) { animation-delay: 0ms; }
      .stagger-children > *:nth-child(2) { animation-delay: 40ms; }
      .stagger-children > *:nth-child(3) { animation-delay: 80ms; }
      .stagger-children > *:nth-child(4) { animation-delay: 120ms; }
      .stagger-children > *:nth-child(5) { animation-delay: 160ms; }
      .stagger-children > *:nth-child(6) { animation-delay: 200ms; }
      .stagger-children > *:nth-child(7) { animation-delay: 240ms; }
      .stagger-children > *:nth-child(8) { animation-delay: 280ms; }
      .stagger-children > *:nth-child(n+9) { animation-delay: 320ms; }

      /* Shimmer / glow helpers for futuristic accents */
      @keyframes shimmer {
        0% { background-position: -400px 0; }
        100% { background-position: 400px 0; }
      }
      @keyframes fx-gradient {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
      }
      @keyframes fx-shine {
        0% { transform: translateX(-120%) skewX(-20deg); }
        100% { transform: translateX(220%) skewX(-20deg); }
      }
      @keyframes fx-border-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 18px rgba(25, 184, 166, 0.25); }
        50% { box-shadow: 0 0 34px rgba(25, 184, 166, 0.5); }
      }
      .animate-glow { animation: glow-pulse 3s ease-in-out infinite; }

      @keyframes ring-fill {
        from { stroke-dashoffset: var(--ring-circumference, 339); }
      }
      .animate-ring { animation: ring-fill 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; }

      @keyframes count-up {
        from { opacity: 0; transform: translateY(6px); filter: blur(3px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      .animate-count { animation: count-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }

      /* Wider app shell on desktop so PC layouts can breathe */
      @media (min-width: 1024px) {
        .app-shell { max-width: 1100px !important; }
        .app-main { max-width: 780px !important; }
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }

      ::selection { background: rgba(25, 184, 166, 0.4); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
