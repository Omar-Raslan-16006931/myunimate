<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Container</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['SF Pro Display', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            },
            colors: {
              violet: { 950: '#1e0a45' },
            },
            animation: {
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 10s infinite',
              'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pop-in': 'popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'scale-in': 'scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'float': 'float 8s ease-in-out infinite',
              'gradient-x': 'gradientX 15s ease infinite',
            },
            keyframes: {
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(20px, -30px) scale(1.05)" },
                "66%": { transform: "translate(-15px, 15px) scale(0.95)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" },
              },
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(15px) scale(0.98)" },
                "100%": { opacity: "1", transform: "translateY(0) scale(1)" },
              },
              popIn: {
                "0%": { opacity: "0", transform: "scale(0.96) translateY(8px)" },
                "100%": { opacity: "1", transform: "scale(1) translateY(0)" },
              },
              scaleIn: {
                "0%": { opacity: "0", transform: "scale(0.96)" },
                "100%": { opacity: "1", transform: "scale(1)" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-10px)" },
              },
              gradientX: {
                "0%, 100%": { "background-position": "0% 50%" },
                "50%": { "background-position": "100% 50%" },
              }
            },
          },
        },
      };
    </script>
    <style>
      :root {
        /* Default (Dark Mode) */
        --bg-gradient: radial-gradient(circle at 50% -20%, #1e0a45 0%, #000000 60%, #000000 100%);
        --card-bg: rgba(30, 30, 40, 0.6);
        --card-border: 1px solid rgba(255, 255, 255, 0.1);
        --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        --text-primary: #FFFFFF;
        --text-muted: rgba(255, 255, 255, 0.6);
        --accent: #8b5cf6;
        --nav-bg: linear-gradient(135deg, rgba(30, 10, 60, 0.9), rgba(50, 20, 90, 0.9));
        --nav-active-bg: rgba(139, 92, 246, 0.2);
        --input-bg: rgba(255,255,255,0.05);
        --modal-bg: #130f1c;
        --schedule-header-bg: rgba(10, 10, 15, 0.95);
        --schedule-grid-lines: rgba(255,255,255,0.1);
      }

      body.light-mode {
        /* Light Mode Overrides */
        --bg-gradient: radial-gradient(circle at 50% -20%, #e0e7ff 0%, #f3f4f6 60%, #ffffff 100%);
        --card-bg: rgba(255, 255, 255, 0.7);
        --card-border: 1px solid rgba(0, 0, 0, 0.05);
        --glass-border: 1px solid rgba(0, 0, 0, 0.05);
        --text-primary: #0f172a;
        --text-muted: rgba(15, 23, 42, 0.6);
        --accent: #7c3aed;
        --nav-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(240, 240, 255, 0.9));
        --nav-active-bg: rgba(124, 58, 237, 0.1);
        --input-bg: rgba(0,0,0,0.05);
        --modal-bg: #ffffff;
        --schedule-header-bg: rgba(255, 255, 255, 0.95);
        --schedule-grid-lines: rgba(0,0,0,0.1);
      }

      body {
        background-color: #000;
        background-image: var(--bg-gradient);
        color: var(--text-primary);
        overflow-x: hidden;
        transition: background-image 0.5s ease, color 0.5s ease;
      }
      
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
  <script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.84.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
