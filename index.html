
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f16" />
    <title>UniMate</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['SF Pro Display', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            },
            colors: {
              violet: { 950: '#1e0a45' },
            },
            animation: {
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 10s infinite',
              'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both',
              'pop-in': 'popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both',
              'scale-in': 'scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both',
              'float': 'float 8s ease-in-out infinite',
              'gradient-x': 'gradientX 15s ease infinite',
            },
            keyframes: {
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(20px, -30px) scale(1.05)" },
                "66%": { transform: "translate(-15px, 15px) scale(0.95)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" },
              },
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(15px) scale(0.98)" },
                "100%": { opacity: "1", transform: "translateY(0) scale(1)" },
              },
              popIn: {
                "0%": { opacity: "0", transform: "scale(0.96) translateY(8px)" },
                "100%": { opacity: "1", transform: "scale(1) translateY(0)" },
              },
              scaleIn: {
                "0%": { opacity: "0", transform: "scale(0.96)" },
                "100%": { opacity: "1", transform: "scale(1)" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-10px)" },
              },
              gradientX: {
                "0%, 100%": { "background-position": "0% 50%" },
                "50%": { "background-position": "100% 50%" },
              }
            },
          },
        },
      };
    </script>
    <style>
      :root {
        /* Default (Dark Mode) */
        --bg-gradient: radial-gradient(circle at 50% -20%, #1e0a45 0%, #0f0f16 60%, #101016 100%);
        --card-bg: rgba(30, 30, 40, 0.6);
        --card-border: 1px solid rgba(255, 255, 255, 0.1);
        --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        --text-primary: #FFFFFF;
        --text-muted: rgba(255, 255, 255, 0.6);
        --accent: #8b5cf6;
        --nav-bg: linear-gradient(135deg, rgba(30, 10, 60, 0.9), rgba(50, 20, 90, 0.9));
        --nav-active-bg: rgba(139, 92, 246, 0.2);
        --input-bg: rgba(255,255,255,0.05);
        --modal-bg: #130f1c;
        --schedule-header-bg: rgba(10, 10, 15, 0.95);
        --schedule-grid-lines: rgba(255,255,255,0.1);
      }

      body.light-mode {
        /* Light Mode Overrides */
        --bg-gradient: radial-gradient(circle at 50% -20%, #e0e7ff 0%, #f3f4f6 60%, #ffffff 100%);
        --card-bg: rgba(255, 255, 255, 0.7);
        --card-border: 1px solid rgba(0, 0, 0, 0.05);
        --glass-border: 1px solid rgba(0, 0, 0, 0.05);
        --text-primary: #0f172a;
        --text-muted: rgba(15, 23, 42, 0.6);
        --accent: #7c3aed;
        --nav-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(240, 240, 255, 0.9));
        --nav-active-bg: rgba(124, 58, 237, 0.1);
        --input-bg: rgba(0,0,0,0.05);
        --modal-bg: #ffffff;
        --schedule-header-bg: rgba(255, 255, 255, 0.95);
        --schedule-grid-lines: rgba(0,0,0,0.1);
      }

      body {
        background-color: #101016;
        background-image: var(--bg-gradient);
        color: var(--text-primary);
        overflow-x: hidden;
        transition: background-image 0.5s ease, color 0.5s ease;
      }
      
      .hide-scroll::-webkit-scrollbar { display: none; }
      .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

      /* ============================================================
         Enter/Exit animation utilities (tailwindcss-animate shim)
         The app uses `animate-in fade-in zoom-in-95 ...` classes that
         require the tailwindcss-animate plugin which is NOT available
         via the CDN build — without this shim none of them animate.
         ============================================================ */
      @keyframes tw-enter {
        from {
          opacity: var(--tw-enter-opacity, 1);
          transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0)
            scale3d(var(--tw-enter-scale, 1), var(--tw-enter-scale, 1), var(--tw-enter-scale, 1));
        }
      }
      .animate-in { animation: tw-enter 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .fade-in { --tw-enter-opacity: 0; }
      .zoom-in-95 { --tw-enter-scale: 0.95; }
      .zoom-in-90 { --tw-enter-scale: 0.9; }
      .slide-in-from-top-1 { --tw-enter-translate-y: -0.25rem; }
      .slide-in-from-top-2 { --tw-enter-translate-y: -0.5rem; }
      .slide-in-from-top-4 { --tw-enter-translate-y: -1rem; }
      .slide-in-from-bottom-1 { --tw-enter-translate-y: 0.25rem; }
      .slide-in-from-bottom-2 { --tw-enter-translate-y: 0.5rem; }
      .slide-in-from-bottom-4 { --tw-enter-translate-y: 1rem; }
      .slide-in-from-bottom-5 { --tw-enter-translate-y: 1.25rem; }
      .slide-in-from-bottom-8 { --tw-enter-translate-y: 2rem; }
      .slide-in-from-bottom-10 { --tw-enter-translate-y: 2.5rem; }
      .slide-in-from-left-2 { --tw-enter-translate-x: -0.5rem; }
      .slide-in-from-left-4 { --tw-enter-translate-x: -1rem; }
      .slide-in-from-right-2 { --tw-enter-translate-x: 0.5rem; }
      .slide-in-from-right-4 { --tw-enter-translate-x: 1rem; }
      .slide-in-from-right-10 { --tw-enter-translate-x: 2.5rem; }
      .animate-in.duration-100 { animation-duration: 100ms; }
      .animate-in.duration-200 { animation-duration: 200ms; }
      .animate-in.duration-300 { animation-duration: 300ms; }
      .animate-in.duration-500 { animation-duration: 500ms; }

      /* Staggered list entrance helper */
      .stagger-children > * { animation: tw-enter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; --tw-enter-opacity: 0; --tw-enter-translate-y: 0.75rem; }
      .stagger-children > *:nth-child(1) { animation-delay: 0ms; }
      .stagger-children > *:nth-child(2) { animation-delay: 40ms; }
      .stagger-children > *:nth-child(3) { animation-delay: 80ms; }
      .stagger-children > *:nth-child(4) { animation-delay: 120ms; }
      .stagger-children > *:nth-child(5) { animation-delay: 160ms; }
      .stagger-children > *:nth-child(6) { animation-delay: 200ms; }
      .stagger-children > *:nth-child(7) { animation-delay: 240ms; }
      .stagger-children > *:nth-child(8) { animation-delay: 280ms; }
      .stagger-children > *:nth-child(n+9) { animation-delay: 320ms; }

      /* Shimmer / glow helpers for futuristic accents */
      @keyframes shimmer {
        0% { background-position: -400px 0; }
        100% { background-position: 400px 0; }
      }
      @keyframes fx-gradient {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
      }
      @keyframes fx-shine {
        0% { transform: translateX(-120%) skewX(-20deg); }
        100% { transform: translateX(220%) skewX(-20deg); }
      }
      @keyframes fx-border-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 18px rgba(139, 92, 246, 0.25); }
        50% { box-shadow: 0 0 34px rgba(139, 92, 246, 0.5); }
      }
      .animate-glow { animation: glow-pulse 3s ease-in-out infinite; }

      @keyframes ring-fill {
        from { stroke-dashoffset: var(--ring-circumference, 339); }
      }
      .animate-ring { animation: ring-fill 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; }

      @keyframes count-up {
        from { opacity: 0; transform: translateY(6px); filter: blur(3px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      .animate-count { animation: count-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }

      /* Wider app shell on desktop so PC layouts can breathe */
      @media (min-width: 1024px) {
        .app-shell { max-width: 1100px !important; }
        .app-main { max-width: 780px !important; }
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }

      ::selection { background: rgba(139, 92, 246, 0.4); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
