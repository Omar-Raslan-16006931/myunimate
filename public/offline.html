<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UniMate</title>
<style>
  :root{--accent:#2ee6d6;--text:#f5f6f8;--muted:rgba(238,240,246,.6);--surface:rgba(255,255,255,.075);--line:rgba(255,255,255,.15)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#0f0f16;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
       padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px);-webkit-text-size-adjust:100%}
  body:before{content:"";position:fixed;inset:0;z-index:-1;background:
     radial-gradient(circle at 15% -5%,rgba(25,184,166,.22),transparent 45%),
     radial-gradient(circle at 100% 30%,rgba(120,90,255,.12),transparent 40%)}
  .wrap{max-width:560px;margin:0 auto}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;border:1px solid rgba(251,191,36,.35);background:rgba(15,23,42,.7);
        color:#fde68a;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .pill i{width:6px;height:6px;border-radius:50%;background:#fbbf24}
  h1{font-size:28px;letter-spacing:-.02em;margin:14px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px;font-weight:700}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .row{display:flex;gap:12px;align-items:center;padding:11px 14px}
  .row+.row{border-top:1px solid var(--line)}
  .time{width:62px;flex-shrink:0;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .time small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .bar{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
  .name{font-size:14.5px;font-weight:600;line-height:1.25}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
  details{border-top:1px solid var(--line)} details:first-child{border-top:0}
  summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer}
  summary::-webkit-details-marker{display:none}
  summary span{font-weight:500;color:var(--muted);font-size:12px}
  .center{min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center}
  .center img{width:72px;height:72px;border-radius:18px}
  .center h3{font-size:20px;margin:18px 0 6px}
  .center p{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.4}
  button{border:0;border-radius:14px;padding:14px 28px;font-size:16px;font-weight:700;background:var(--accent);color:#062a28;width:100%;margin-top:26px}
  .center button{width:auto;margin:0}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
</style></head>
<body>
<div id="app"></div>
<script>
(function () {
  var SITE = 'https://omar-unimate.vercel.app';
  var KEY = 'unimate_offline_snapshot_v1'; // the app saves its schedule under this key
  var COLORS = { lecture: '#2ee6d6', tutorial: '#6aa5ff', lab: '#b794ff', quiz: '#ff8fb1', assignment: '#ff8fb1', exam: '#ffb340', study: '#9be15d', other: '#9aa0ae' };
  var app = document.getElementById('app');

  function goOnline() { location.href = SITE; }
  window.addEventListener('online', goOnline);
  // test the connection now and then: as soon as it works, go back to the app on its own
  setInterval(function () {
    fetch(SITE + '/favicon.png?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' }).then(goOnline).catch(function () {});
  }, 8000);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function at(d, hhmm) { var p = String(hhmm || '0:0').split(':'); var x = new Date(d); x.setHours(+p[0] || 0, +p[1] || 0, 0, 0); return x; }
  function t12(d) { var h = d.getHours(); return (h % 12 || 12) + ':' + pad(d.getMinutes()) + ' ' + (h >= 12 ? 'PM' : 'AM'); }
  function title(e) {
    var t = String(e.title || '').trim();
    var c = t.replace(/\b[A-Za-z]{2,6}[\s-]?\d{3,4}[A-Za-z]?\b/g, ' ').replace(/\s+/g, ' ').replace(/^[\s\-–—:·,|\/]+|[\s\-–—:·,|\/]+$/g, '');
    return c || t;
  }
  function ago(ms) {
    if (!ms) return '';
    var m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60);
    if (h < 24) return h + ' h ago';
    return Math.round(h / 24) + ' d ago';
  }
  function dayItems(events, day) {
    var name = day.toLocaleDateString('en-US', { weekday: 'long' }), key = iso(day);
    return events.filter(function (e) {
      if (!/^\d{1,2}:\d{2}$/.test(e.time || '')) return false;
      return e.recurring ? e.day === name : e.date === key;
    }).sort(function (a, b) { return at(day, a.time) - at(day, b.time); });
  }
  function row(e, day) {
    var s = at(day, e.time), end = new Date(s.getTime() + (e.mins > 0 ? e.mins : 60) * 60000);
    var meta = [e.type ? e.type.charAt(0).toUpperCase() + e.type.slice(1) : '', e.where].filter(Boolean).join(' · ');
    return '<div class="row"><div class="time">' + t12(s).replace(' ', '&nbsp;') + '<small>' + t12(end).replace(' ', '&nbsp;') + '</small></div>' +
      '<div class="bar" style="background:' + (COLORS[e.type] || COLORS.other) + '"></div>' +
      '<div><div class="name">' + esc(title(e)) + '</div><div class="meta">' + esc(meta) + '</div></div></div>';
  }
  function header(snap) {
    return '<span class="pill"><i></i>Offline · view only</span><h1>Your schedule</h1>' +
      '<p class="sub">Saved copy' + (snap && snap.savedAt ? ' · updated ' + ago(snap.savedAt) : '') + '</p>';
  }
  function plain() {
    app.innerHTML = '<div class="center"><div><img src="apple-touch-icon.png" alt=""><h3>No connection</h3>' +
      '<p>UniMate needs the internet to open.<br>Check your Wi-Fi or mobile data.</p><button onclick="location.href=\'' + SITE + '\'">Try again</button></div></div>';
  }
  function render(snap) {
    var events = snap.events || [], now = new Date(), today = new Date(now); today.setHours(0, 0, 0, 0);
    var out = '<div class="wrap">' + header(snap);

    var td = dayItems(events, today);
    out += '<h2>Today · ' + today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) + '</h2><div class="card">' +
      (td.length ? td.map(function (e) { return row(e, today); }).join('') : '<div class="empty">Nothing on today.</div>') + '</div>';

    var exams = events.filter(function (e) { return e.type === 'exam' && e.date && e.date >= iso(today); })
      .sort(function (a, b) { return (a.date + a.time) < (b.date + b.time) ? -1 : 1; }).slice(0, 8);
    out += '<h2>Upcoming exams</h2><div class="card">';
    if (!exams.length) out += '<div class="empty">No exams coming up.</div>';
    exams.forEach(function (e) {
      var p = e.date.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
      out += '<div class="row"><div class="time">' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '<small>' + t12(at(d, e.time)).replace(' ', '&nbsp;') + '</small></div>' +
        '<div class="bar" style="background:' + COLORS.exam + '"></div><div><div class="name">' + esc(title(e)) + '</div><div class="meta">' +
        esc([d.toLocaleDateString('en-US', { weekday: 'long' }), e.where].filter(Boolean).join(' · ')) + '</div></div></div>';
    });
    out += '</div>';

    var week = '';
    for (var i = 1; i <= 6; i++) {
      var d2 = new Date(today); d2.setDate(d2.getDate() + i);
      var items = dayItems(events, d2);
      if (!items.length) continue;
      week += '<details><summary>' + d2.toLocaleDateString('en-US', { weekday: 'long' }) + '<span>' + d2.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + items.length + (items.length === 1 ? ' item' : ' items') + '</span></summary>' +
        items.map(function (e) { return row(e, d2); }).join('') + '</details>';
    }
    if (week) out += '<h2>Coming days</h2><div class="card">' + week + '</div>';

    out += '<button onclick="location.href=\'' + SITE + '\'">Try again</button><div class="hint">UniMate opens by itself when you are back online.</div></div>';
    app.innerHTML = out;
  }

  function read() {
    var C = window.Capacitor, P = C && C.Plugins && C.Plugins.Preferences;
    if (!P) return Promise.resolve(null);
    return P.get({ key: KEY }).then(function (r) { return r && r.value ? JSON.parse(r.value) : null; }).catch(function () { return null; });
  }
  read().then(function (snap) { if (snap && snap.events && snap.events.length) render(snap); else plain(); });
})();
</script>
</body></html>
